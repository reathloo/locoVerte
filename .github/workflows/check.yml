name: Check extension

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JavaScript and JSON
        run: |
          for file in src/*.js tests/*.js tests/*.mjs; do node --check "$file"; done
          python -m json.tool manifest.json > /dev/null
          for file in _locales/*/messages.json; do python -m json.tool "$file" > /dev/null; done
      - name: Build bundled offline libraries
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:vendor
          git diff --exit-code -- vendor/generated
      - name: Test store package
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          pnpm test:local
      - name: Build release packages
        run: |
          python scripts/package_extension.py
          python scripts/package_source.py
      - name: Lint packaged Firefox extension
        run: |
          archive=$(find dist -maxdepth 1 -name 'locoverte-*.zip' ! -name '*-source.zip' -print -quit)
          test -n "$archive"
          mkdir -p dist/firefox-lint
          python -m zipfile -e "$archive" dist/firefox-lint
          pnpm exec web-ext lint --source-dir dist/firefox-lint
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/*.zip
